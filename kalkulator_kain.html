<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sisa Kain</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .calculator-card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-align: center;
            color: var(--text-main);
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .unit {
            position: absolute;
            right: 1rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            pointer-events: none;
        }

        .result-box {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            margin-top: 2rem;
            transition: transform 0.3s ease;
        }

        .result-box:hover {
            transform: scale(1.02);
        }

        .result-label {
            font-size: 0.875rem;
            opacity: 0.9;
            margin-bottom: 0.5rem;
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: 700;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 0.25rem;
        }

        .result-unit {
            font-size: 1rem;
            font-weight: 500;
            opacity: 0.9;
        }

        .error-msg {
            color: #DC2626;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h1>Kalkulator Sisa Kain</h1>
        <p class="subtitle">Hitung sisa panjang kain dalam roll dengan mudah</p>

        <div class="input-group">
            <label for="panjangAwal">Panjang Roll Kain Awal</label>
            <div class="input-wrapper">
                <input type="number" id="panjangAwal" placeholder="Contoh: 100" min="0" step="0.1">
                <span class="unit">meter</span>
            </div>
        </div>

        <div class="input-group">
            <label for="kainTerpakai">Meter Kain Terpakai</label>
            <div class="input-wrapper">
                <input type="number" id="kainTerpakai" placeholder="Contoh: 25.5" min="0" step="0.1">
                <span class="unit">meter</span>
            </div>
            <div id="errorMsg" class="error-msg">Kain terpakai tidak boleh melebihi panjang awal!</div>
        </div>

        <div class="result-box" id="resultBox">
            <div class="result-label">Sisa Kain Saat Ini</div>
            <div class="result-value">
                <span id="sisaKain">0</span>
                <span class="result-unit">meter</span>
            </div>
        </div>
    </div>

    <script>
        const inputAwal = document.getElementById('panjangAwal');
        const inputTerpakai = document.getElementById('kainTerpakai');
        const sisaKain = document.getElementById('sisaKain');
        const errorMsg = document.getElementById('errorMsg');

        function hitungSisa() {
            const awal = parseFloat(inputAwal.value) || 0;
            const terpakai = parseFloat(inputTerpakai.value) || 0;

            if (terpakai > awal) {
                errorMsg.style.display = 'block';
                sisaKain.textContent = '0';
            } else {
                errorMsg.style.display = 'none';
                const sisa = awal - terpakai;
                // Format to maximum 2 decimal places to avoid floating point issues
                sisaKain.textContent = sisa.toLocaleString('id-ID', { maximumFractionDigits: 2 });
            }
        }

        inputAwal.addEventListener('input', hitungSisa);
        inputTerpakai.addEventListener('input', hitungSisa);
    </script>
</body>
</html>
